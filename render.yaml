databases:
  - name: restaurant-db
    plan: free
    region: singapore

services:
  - type: web
    name: cn331-restaurant
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: cd main/myproject && gunicorn myproject.wsgi:application
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
